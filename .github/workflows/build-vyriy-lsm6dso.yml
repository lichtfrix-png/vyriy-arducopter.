name: VYRIY F405 V5.1 - native LSM6DSO bench build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch ArduPilot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          git clone --branch Copter-4.7.2 --depth 1 https://github.com/ArduPilot/ardupilot.git ardupilot
          cd ardupilot
          git submodule update --init --recursive
          git rev-parse HEAD | tee ../logs/source-commit.txt

      - name: Install ARM compiler and build dependencies
        shell: bash
        env:
          DO_AP_STM_ENV: '1'
          DO_PYTHON_VENV_ENV: '1'
          SKIP_AP_COMPLETION_ENV: '1'
          SKIP_AP_GIT_CHECK: '1'
        run: |
          set -euo pipefail
          cd ardupilot
          bash Tools/environment_install/install-prereqs-ubuntu.sh -y > ../logs/prerequisites.log 2>&1
          compiler=$(find "$HOME/opt" /opt -type f -name arm-none-eabi-gcc -print -quit 2>/dev/null || true)
          if [ -z "$compiler" ]; then compiler=$(command -v arm-none-eabi-gcc || true); fi
          if [ -z "$compiler" ]; then echo 'ARM compiler missing' >&2; exit 1; fi
          echo "$(dirname "$compiler")" >> "$GITHUB_PATH"
          "$compiler" --version | head -1

      - name: Install independent LSM6DSO driver and VYRIY hardware definition
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/vyriy_lsm6dso_patch.py <<'PYCODE'
          from pathlib import Path
          import base64
          root=Path('ardupilot').resolve()
          ins=root/'libraries/AP_InertialSensor'

          def replace_once(path, original, replacement):
              old=path.read_text(encoding='utf8')
              hits=old.count(original)
              if hits != 1:
                  raise RuntimeError(f'{path}: expected one instance of {original!r}; found {hits}')
              path.write_text(old.replace(original, replacement, 1), encoding='utf8')

          (ins/'AP_InertialSensor_LSM6DSO.h').write_bytes(base64.b64decode(''))
          (ins/'AP_InertialSensor_LSM6DSO.cpp').write_bytes(base64.b64decode(''))

          # Connect new driver to generated HAL_INS_PROBE_LIST and give it a unique device ID.
          replace_once(ins/'AP_InertialSensor.cpp',
              '#include "AP_InertialSensor_ASM330.h"',
              '#include "AP_InertialSensor_ASM330.h"\n#include "AP_InertialSensor_LSM6DSO.h"')
          replace_once(ins/'AP_InertialSensor_Backend.h',
              'DEVTYPE_INS_ADIS16607 = 0x40,',
              'DEVTYPE_INS_ADIS16607 = 0x40,\n        DEVTYPE_INS_LSM6DSO = 0x41,')

          board=root/'libraries/AP_HAL_ChibiOS/hwdef/speedybeef4v4/hwdef.dat'
          replace_once(board,
              '# for SPEEDYBEEF405V4 hardware.',
              '# EXPERIMENTAL VYRIY F405 V5.1: standalone LSM6DSO backend, NOT flight tested.\n'
              '# Temporary SpeedyBee V4 board ID / bootloader retained (NOT verified VYRIY compatibility).')
          replace_once(board,
              'PC9 TIM8_CH4 TIM8 PWM(6) GPIO(55)        # M6',
              'PB15 TIM12_CH2 TIM12 PWM(6) GPIO(55) NODMA # VYRIY SERVO1')
          replace_once(board,
              'PC8 TIM8_CH3 TIM8 PWM(5) GPIO(54)        # M5',
              'PC8 TIM8_CH3 TIM8 PWM(5) GPIO(54) # VYRIY SERVO2')
          replace_once(board,
              'define AP_BARO_SPL06_ENABLED 1',
              'define AP_BARO_DPS280_ENABLED 1')
          replace_once(board,
              'BARO SPL06 I2C:0:0x76',
              'BARO DPS310 I2C:0:0x76')
          replace_once(board,
              'IMU Invensensev3 SPI:imu1 ROTATION_PITCH_180_YAW_270',
              '# LSM6DSO uses its own driver; ROTATION_NONE is only provisional.\n'
              'IMU LSM6DSO SPI:imu1 ROTATION_NONE')
          print('LSM6DSO source installed, hwdef patched')
          PYCODE
          python3 /tmp/vyriy_lsm6dso_patch.py
          git -C ardupilot diff -- libraries/AP_InertialSensor/AP_InertialSensor.cpp libraries/AP_InertialSensor/AP_InertialSensor_Backend.h libraries/AP_HAL_ChibiOS/hwdef/speedybeef4v4/hwdef.dat > logs/modified-existing-files.patch
          cp ardupilot/libraries/AP_InertialSensor/AP_InertialSensor_LSM6DSO.* logs/

      - name: Configure and compile bench firmware
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$HOME/venv-ardupilot/bin/activate" ]; then source "$HOME/venv-ardupilot/bin/activate"; fi
          cd ardupilot
          (./waf configure --board speedybeef4v4 && ./waf copter) 2>&1 | tee ../logs/build.log
          test -s build/speedybeef4v4/bin/arducopter.apj

      - name: Collect firmware (NO bootloader HEX)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firmware
          cp ardupilot/build/speedybeef4v4/bin/arducopter.apj firmware/
          cp ardupilot/build/speedybeef4v4/bin/arducopter.bin firmware/
          cat > firmware/READ_ME_BEFORE_FLASHING.txt <<'EOF'
          EXPERIMENTAL VYRIY F405 V5.1 LSM6DSO BENCH firmware.
          Dedicated LSM6DSO SPI driver (WHOAMI 0x6C, 833Hz gyro/accel, direct-register polling).
          NOT flight-tested or verified on actual hardware. NO FLYING.
          RETAINS SPEEDYBEE F405 V4 APJ BOARD ID AND BOOTLOADER LAYOUT.
          NEVER FLASH THE SPEEDYBEE BOOTLOADER TO VYRIY.
          Validate actual bootloader / flash layout before ANY flash.
          Board rotation ROTATION_NONE IS UNVERIFIED. NO PROPELLERS.
          Backup current full flash and bootloader before testing.
          EOF
          sha256sum firmware/arducopter.* > firmware/SHA256SUMS.txt

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VYRIY-F405V51-LSM6DSO-BENCH-ONLY
          path: firmware/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VYRIY-LSM6DSO-build-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 30
